name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm run build
    - run: npm run test:unit
    - name: Play the sample games in a phone browser
      run: |
        npx playwright install --with-deps chromium
        (node scripts/serve-build.js 8601 >/dev/null 2>&1 &)
        npm run test:smoke
