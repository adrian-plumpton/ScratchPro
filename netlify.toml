# Netlify build settings for ScratchPro
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_ENV = "production"
  NODE_OPTIONS = "--max-old-space-size=4096"
  # NODE_ENV=production makes npm skip devDependencies, but the build tools
  # (rimraf, mkdirp, webpack) are devDependencies, so install them anyway.
  NPM_FLAGS = "--include=dev"

# Production script files have a content hash in their names, so they can be cached for good.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be checked for updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The play page's service worker (offline games) too.
[[headers]]
  for = "/play-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Sparkjam: clean URLs for the games gallery and the game page.
[[redirects]]
  from = "/games"
  to = "/games.html"
  status = 200

[[redirects]]
  from = "/my-games"
  to = "/my-games.html"
  status = 200

[[redirects]]
  from = "/game"
  to = "/game.html"
  status = 200

# Sparkjam: jam invite links (/j/4827) open the editor and join the jam.
[[redirects]]
  from = "/j/:code"
  to = "/editor.html?jam=:code"
  status = 302
